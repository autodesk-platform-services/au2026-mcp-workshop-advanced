<svg width="680" height="840" viewBox="0 0 680 840" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sequence diagram: VS Code, the MCP server's OAuth proxy, and Autodesk (APS)</title>
<desc>VS Code requests /mcp, gets a 401, discovers the OAuth proxy on the same domain, and opens /authorize with its own redirect URI. The server redirects the user to sign in with Autodesk, receives the authorization code at /auth/callback, trades it for an APS token, and mints its own code for VS Code. VS Code exchanges that code at /token for an MCP access token, then calls /mcp with it as a bearer token.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: Arial, Helvetica, sans-serif; }
.title { font-size: 14px; font-weight: 700; fill: #000000; }
.subtitle { font-size: 12px; fill: #666666; }
.label { font-size: 12px; fill: #000000; }
.aside { font-size: 12px; fill: #666666; font-style: italic; }
.legend { font-size: 12px; fill: #000000; }
.callout { font-size: 12px; font-weight: 700; fill: #136b9a; }
</style>
</defs>
<rect x="40" y="20" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="title" x="120" y="38" text-anchor="middle">VS Code</text>
<text class="subtitle" x="120" y="56" text-anchor="middle">MCP client</text>
<rect x="260" y="20" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="title" x="340" y="38" text-anchor="middle">Your MCP server</text>
<text class="subtitle" x="340" y="56" text-anchor="middle">+ Auth Server</text>
<rect x="480" y="20" width="160" height="56" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1"/>
<text class="title" x="560" y="38" text-anchor="middle">Autodesk (APS)</text>
<text class="subtitle" x="560" y="56" text-anchor="middle">OAuth provider</text>
<line x1="120" y1="76" x2="120" y2="680" stroke="#d5d5cb" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="340" y1="76" x2="340" y2="680" stroke="#d5d5cb" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="560" y1="76" x2="560" y2="680" stroke="#d5d5cb" stroke-width="1" stroke-dasharray="4 3"/>
<text class="label" x="230" y="100" text-anchor="middle">1. GET /mcp</text>
<line x1="120" y1="114" x2="340" y2="114" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="146" text-anchor="middle">401 Unauthorized</text>
<line x1="340" y1="160" x2="120" y2="160" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="192" text-anchor="middle">2. discover OAuth metadata</text>
<line x1="120" y1="206" x2="340" y2="206" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="238" text-anchor="middle">auth server on this domain</text>
<line x1="340" y1="252" x2="120" y2="252" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="284" text-anchor="middle">3. GET /authorize</text>
<line x1="120" y1="298" x2="340" y2="298" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="450" y="330" text-anchor="middle">4. redirect to Autodesk</text>
<line x1="340" y1="344" x2="560" y2="344" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="aside" x="450" y="376" text-anchor="middle">(user signs in with Autodesk)</text>
<text class="label" x="450" y="422" text-anchor="middle">5. redirect w/ APS code</text>
<line x1="560" y1="436" x2="340" y2="436" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="aside" x="230" y="468" text-anchor="middle">(gets an APS token)</text>
<text class="label" x="230" y="514" text-anchor="middle">6. redirect w/ MCP code</text>
<line x1="340" y1="528" x2="120" y2="528" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="560" text-anchor="middle">7. POST /token</text>
<line x1="120" y1="574" x2="340" y2="574" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="606" text-anchor="middle">MCP access token</text>
<line x1="340" y1="620" x2="120" y2="620" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow)"/>
<text class="label" x="230" y="652" text-anchor="middle">GET /mcp with MCP token</text>
<line x1="120" y1="666" x2="340" y2="666" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="135" y="690" width="190" height="26" rx="13" fill="#bfe4f7" stroke="#1d91d0" stroke-width="1"/>
<text class="callout" x="230" y="707" text-anchor="middle">authenticated</text>
<line x1="60" y1="743" x2="74" y2="743" stroke="#000000" stroke-width="1.5"/>
<text class="legend" x="82" y="747" text-anchor="start">Solid line: request</text>
<line x1="60" y1="773" x2="74" y2="773" stroke="#666666" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="legend" x="82" y="777" text-anchor="start">Dashed line: response or redirect</text>
<rect x="60" y="796" width="14" height="14" rx="3" fill="#bfe4f7" stroke="#1d91d0" stroke-width="1"/>
<text class="legend" x="82" y="807" text-anchor="start">Session authenticated</text>
</svg>
